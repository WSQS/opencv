name: Build OpenCV with MinGW on Windows

on:
  push:
    branches:
      - 4.x  # 或你正在开发的分支

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install mingw cmake ninja -y

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_C_COMPILER=gcc" "-DCMAKE_CXX_COMPILER=g++" "-DBUILD_TESTS=OFF" "-DBUILD_PERF_TESTS=OFF" "-DBUILD_EXAMPLES=OFF" "-DBUILD_opencv_gapi=OFF"

    - name: Build
      run: |
        cd build
        mingw32-make -j4
    
    - name: Install OpenCV
      run: |
        cd build
        cmake --install . --prefix ../install
    
    - name: Collect GNU Libraries
      run: |
        ls C:\ProgramData\mingw64\mingw64\bin
        Copy-Item C:\ProgramData\mingw64\mingw64\bin\*.lib -Destination ./install/lib -Force

    - name: Archive binaries
      uses: actions/upload-artifact@v4
      with:
        name: opencv-mingw-bin
        path: install
